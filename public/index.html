*{box-sizing:border-box}html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

nav.side .brand,nav.side .who{display:none}
nav.side button{flex:1;background:none;border:0;padding:.65rem .2rem;font-size:.72rem;color:var(--mute);cursor:pointer}
nav.side button[aria-current=page]{color:var(--ac);font-weight:700}
main{padding:1rem 1rem 6rem}
/* DESKTOP layout: left sidebar, wide content */
@media (min-width:900px){
 nav.side{top:0;bottom:auto;right:auto;width:230px;height:100%;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:1.2rem .8rem}
 nav.side .brand{display:block;font-weight:700;font-size:1.1rem;margin:0 .5rem 1rem}
 nav.side .who{display:block;margin-top:auto;padding:.6rem .5rem;font-size:.85rem}

 nav.side button[aria-current=page]{background:var(--acs)}

 .toast{bottom:1.5rem}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
}
.wiz{max-width:760px;margin:4vh auto;padding:0 1rem 4rem}.steps{display:flex;gap:.4rem;margin:1rem 0}.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps span.on{background:var(--ac)}
.opt{display:block;width:100%;text-align:left;cursor:pointer;margin-bottom:.6rem;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}.opt[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.pill.rec{background:var(--acs);color:var(--ac)}.pill.no{background:var(--bads);color:var(--bad)}
/* THEME: white, navy, orange, yellow + pastels */
:root{--bg:#f5f7fc;--sf:#fff;--ink:#14234b;--mute:#5f6d95;--line:#e0e6f3;--ac:#1b2f6b;--acs:#e2e9ff;--on:#fff;--or:#f47c20;--ors:#ffe8d4;--ye:#f8c93a;--yes:#fff3c2;--lv:#ece6ff;--mi:#d8f4e6;--pk:#ffe0e6;--warn:#b45309;--warns:#fff3c2;--bad:#c62a47;--bads:#ffe0e6;--ok:#17724a;--oks:#d8f4e6}

:root[data-theme="dark"]{--bg:#0b1330;--sf:#141f45;--ink:#eef2ff;--mute:#9aa8d4;--line:#26325f;--ac:#9db8ff;--acs:#1d2c5e;--on:#0b1330;--or:#ff9a4d;--ors:#4a2d17;--ye:#f8c93a;--yes:#463a12;--lv:#2c2760;--mi:#17402f;--pk:#4a1d2a;--warn:#ffc15a;--warns:#463a12;--bad:#ff8aa0;--bads:#4a1d2a;--ok:#7fe0b0;--oks:#17402f}
body{background:radial-gradient(800px 380px at 105% -8%,var(--yes),transparent 60%),radial-gradient(700px 380px at -8% 0,var(--acs),transparent 58%),var(--bg);background-attachment:fixed}
:focus-visible{outline:2px solid var(--or)}input:focus,select:focus,textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
h1{font-weight:700;color:var(--ink)}main>h1::after,.wiz h1::after,.login h1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--ye);margin-top:.4rem}
.btn{background:var(--ac);color:var(--on)}.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(20,35,75,.05),0 8px 20px rgba(20,35,75,.05)}
.stats .stat{border:0;color:var(--ink)}.stats .stat:nth-child(1){background:var(--acs)}.stats .stat:nth-child(2){background:var(--yes)}.stats .stat:nth-child(3){background:var(--ors)}.stats .stat:nth-child(4){background:var(--pk)}.stats .stat:nth-child(5){background:var(--mi)}
.stat b{font-size:1.9rem;color:var(--ink)}.stats .stat:nth-child(4) b{color:var(--bad)}
.tbl th{color:var(--ac)}
.pill{background:var(--acs);color:var(--ac)}.pill.p-ScopeofWork{background:var(--acs);color:var(--ac)}.pill.p-Planned{background:var(--lv);color:var(--ink)}.pill.p-Pending{background:var(--yes);color:var(--ink)}.pill.p-ToBeValidated{background:var(--ors);color:var(--warn)}.pill.p-Completed{background:var(--mi);color:var(--ok)}.pill.p-Invalid,.pill.late{background:var(--pk);color:var(--bad)}
.pill.rec{background:var(--ye);color:#14234b}.pill.no{background:var(--pk);color:var(--bad)}
.task{border-left:5px solid var(--line)}.task:hover{border-color:var(--or)}.t-ScopeofWork{border-left-color:#9db8ff}.t-Planned{border-left-color:#b9a7ff}.t-Pending{border-left-color:var(--ye)}.t-ToBeValidated{border-left-color:var(--or)}.t-Completed{border-left-color:#5fcf9b}.t-Invalid{border-left-color:var(--bad)}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.steps span.on{background:var(--or)}.opt[aria-pressed=true]{border-color:var(--or);box-shadow:0 0 0 3px var(--ors);background:var(--sf)}.opt{border-radius:14px}
dialog{border-radius:16px}.toast{background:#14234b;color:#fff;border-left:4px solid var(--or)}
nav.side button[aria-current=page]{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--or)}
@media (min-width:900px){
 nav.side{background:#14234b;border-right:0}
 nav.side .brand{color:#fff}nav.side .brand::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--ye);margin-right:.55rem}
 nav.side button{color:#c9d3f3;box-shadow:none}nav.side button:hover{background:rgba(255,255,255,.09)}
 nav.side button[aria-current=page]{background:var(--or);color:#14234b;box-shadow:none}
 nav.side .who{color:#c9d3f3;border-top:1px solid rgba(255,255,255,.15)}nav.side .who b{color:#fff}nav.side .who .mute{color:#aab6e0}
 nav.side .who .btn.ghost{color:#fff!important;border-color:rgba(255,255,255,.35)}
}

<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=t=>{if(!t)return'–';const d=new Date(t);return`${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>`${Math.floor(m/60)}h ${pad(m%60)}m`;
const KEY='tms.v1';let STATUS=null,tok=null,rev=0,saveT=0;
const MAP={sheets:'sheets',db:'postgres',server:'postgres',local:'file'};
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{status:r.status,body:j});return j};
async function pull(){const j=await api('GET','/api/state');const{me:m,rev:r,...st}=j;S=st;rev=r;me=S.employees.find(e=>e.name===m)||null}
async function push(){if(S.demo||!tok)return;try{const j=await api('PUT','/api/state',{...S,rev});rev=j.rev}catch(e){if(e.status===409){toast('Someone else updated the data. Reloading.');await pull();render()}else toast('Could not save: '+e.message)}}
let S,me=null,view='dashboard',tab='todo',mode='login',W={step:1,size:'',be:'',cfg:{},team:[]};
const emp=(n,role,team,mgr,ss='09:00',se='18:00',l='13:00')=>({name:n,role,team,manager:mgr,shiftStart:ss,shiftEnd:se,lunch:l});
function seed(){const n=Date.now(),h=36e5;return{setup:{done:true,size:'1-10',backend:'local'},demo:true,managerAccess:true,holidays:['2026-12-25','2027-01-26'],nextId:6,nextM:2,
 employees:[emp('Aarav Mehta','Admin','Operations',''),emp('Neha Sharma','Manager','Sales','Aarav Mehta'),emp('Rohit Verma','Member','Sales','Neha Sharma'),emp('Priya Nair','Member','Operations','Aarav Mehta','10:00','19:00','14:00'),emp('Kabir Singh','Member','Operations','Aarav Mehta')],
 masters:[{id:1,title:'Daily stock report',type:'Recurring',freq:'Daily',doer:'Priya Nair',validator:'Aarav Mehta',team:'Operations',lead:60,active:true}],
 tasks:[
 {id:1,mid:0,title:'Send Diwali offer to top 50 clients',desc:'Use the approved template and track replies.',type:'One-Time',team:'Sales',doer:'Rohit Verma',validator:'Neha Sharma',start:n-5*h,lead:240,end:n+20*h,status:'Pending',creator:'Neha Sharma',comments:[]},
 {id:2,mid:0,title:'Update vendor price sheet',desc:'',type:'One-Time',team:'Operations',doer:'Kabir Singh',validator:'Aarav Mehta',start:n-30*h,lead:180,end:n-20*h,status:'Pending',creator:'Aarav Mehta',comments:[]},
 {id:3,mid:0,title:'Weekly sales review deck',desc:'Include pipeline and lost deals.',type:'One-Time',team:'Sales',doer:'Rohit Verma',validator:'Neha Sharma',start:n-26*h,lead:300,end:n-2*h,status:'To Be Validated',creator:'Neha Sharma',comments:[{by:'Rohit Verma',t:n-3*h,x:'Deck is ready, please check slide 6.'}]},
 {id:4,mid:0,title:'Audit warehouse bin labels',desc:'',type:'One-Time',team:'Operations',doer:'Priya Nair',validator:'Aarav Mehta',start:n+h,lead:480,end:n+60*h,status:'Scope of Work',creator:'Aarav Mehta',comments:[]},
 {id:5,mid:0,title:'Close October invoices',desc:'',type:'One-Time',team:'Sales',doer:'Rohit Verma',validator:'Neha Sharma',start:n-90*h,lead:120,end:n-80*h,status:'Completed',done:n-82*h,creator:'Neha Sharma',comments:[]}]}}
const empty=()=>({setup:null,managerAccess:true,holidays:[],nextId:1,nextM:1,employees:[],masters:[],tasks:[]});
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=empty();else if(!S.setup){S.setup={done:true,size:'1-10',backend:'local'};S.demo=true}}
function save(){if(!STATUS){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}clearTimeout(saveT);saveT=setTimeout(push,300)}
const E=n=>S.employees.find(e=>e.name===n)||{shiftStart:'09:00',shiftEnd:'18:00',lunch:''};
/* Working-time engine: respects shift, lunch (30 min), holidays and Sat/Sun settings */
function addWork(start,mins,e,sat,sun){const c=new Date(start),[sh,sm]=e.shiftStart.split(':').map(Number),[eh,em]=e.shiftEnd.split(':').map(Number),s0=sh*60+sm,e0=eh*60+em;let ls=null,le=null;
 if(e.lunch){const[a,b]=e.lunch.split(':').map(Number),x=a*60+b;if(x>s0&&x+30<e0){ls=x;le=x+30}}
 let g=0;while(mins>0&&g++<5000){const d=c.getDay();
  if((d===0&&!sun)||(d===6&&!sat)||S.holidays.includes(iso(c))){c.setDate(c.getDate()+1);c.setHours(sh,sm,0,0);continue}
  let m=c.getHours()*60+c.getMinutes();
  if(m<s0){c.setHours(sh,sm,0,0);m=s0}
  if(m>=e0){c.setDate(c.getDate()+1);c.setHours(sh,sm,0,0);continue}
  if(ls!==null&&m>=ls&&m<le){c.setHours(Math.floor(le/60),le%60,0,0);continue}
  const nb=(ls!==null&&m<ls)?ls:e0,av=nb-m;
  if(av>=mins){c.setMinutes(c.getMinutes()+mins);mins=0}else{c.setMinutes(c.getMinutes()+av);mins-=av}}
 return c.getTime()}
const isAdmin=()=>me.role==='Admin',isMgr=()=>me.role==='Manager';
const late=t=>t.end<Date.now()&&!['Completed','Invalid'].includes(t.status);
const sc=s=>s.replace(/ /g,'');
function visible(){if(isAdmin())return S.tasks;if(isMgr())return S.tasks.filter(t=>t.team===me.team||t.doer===me.name||t.validator===me.name||t.creator===me.name);
 return S.tasks.filter(t=>t.doer===me.name||t.validator===me.name)}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,2500)}
const NAV=[['dashboard','Dashboard'],['delegate','Delegate'],['mytasks','My tasks'],['master','Recurring'],['team','Team'],['settings','Settings']];
function shell(body){return`<nav class="side" aria-label="Main"><div class="brand">Team Management</div>${NAV.filter(n=>allowed(n[0])).map(n=>`<button data-act="nav" data-v="${n[0]}" ${view===n[0]?'aria-current="page"':''}>${n[1]}</button>`).join('')}<div class="who"><b>${esc(me.name)}</b><br><span class="mute">${me.role} · ${esc(me.team)}</span><br><button class="btn ghost sm" data-act="logout" style="margin-top:.5rem;flex:none;padding:.3rem .7rem;font-size:.8rem;color:var(--ink)">Sign out</button></div></nav><main>${body}</main>`}
function allowed(v){if(v==='settings'||v==='team'||v==='master')return isAdmin()||(isMgr()&&v!=='settings');return true}
function render(){const a=$('#app');if(!S.setup||!S.setup.done){a.innerHTML=wizard();return}if(!me&&!S.demo){a.innerHTML=loginPage();return}if(!me){a.innerHTML=`<div class="login"><h1>Team Management</h1><p class="mute">Choose who you are. In a live setup this step is replaced by email or OTP login.</p><div style="margin-top:1rem">${S.employees.map(e=>`<button class="card u btn ghost" data-act="login" data-n="${esc(e.name)}"><span><b>${esc(e.name)}</b><br><span class="mute sm">${esc(e.team)}</span></span><span class="pill">${e.role}</span></button>`).join('')}</div></div>`;return}
 a.innerHTML=shell(V[view]())}
const SIZES=[['1-10','1–10 people','Small team or a single office'],['11-50','11–50 people','Growing team with a few managers'],['51-200','51–200 people','Several teams and departments'],['200+','200+ people','Large organisation with many daily tasks']];
const NOTE={'1-10':'For small teams, Free PostgreSQL (Neon/Supabase) or Google Sheets is ideal.','11-50':'A PostgreSQL cloud database provides fast, reliable multi-user performance.','51-200':'Use a managed PostgreSQL database (Neon, Supabase, or AWS) for high concurrency.','200+':'Use a dedicated PostgreSQL server with automated backups.'};
const BE={
  db:{n:'Option 1: Free Cloud Database (Neon / Supabase)',tag:'100% Free · Recommended ($0/mo)',badge:'rec',d:'Connect a free PostgreSQL database. Data is safe forever even when Render sleeps or redeploys.'},
  local:{n:'Option 2: Render Persistent Disk (Server Storage)',tag:'Starts at $7/mo + $0.25/GB Disk',badge:'no',d:'Saves files on server disk. Requires Render Starter plan ($7/mo) + Persistent Disk ($0.25/GB/mo).'},
  sheets:{n:'Option 3: Google Sheets (Personal Drive)',tag:'Free for small teams ($0/mo)',badge:'rec',d:'Save tasks directly in your Google Sheet using Google Cloud Service Account credentials.'}
};
const sha=async(s,p)=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(d)].map(b=>pad(b.toString(16))).join('')};
const steps=()=>`<div class="steps" role="img" aria-label="Step ${W.step} of 4">${[1,2,3,4].map(i=>`<span class="${i<=W.step?'on':''}"></span>`).join('')}</div>`;
const back=()=>`<button class="btn ghost" data-act="wback">Back</button>`;
function connForm(){
  if(W.be==='db'){
    return`<div class="card" style="margin:.4rem 0 1rem;border-left:4px solid var(--ac)">
      <h3 style="margin:0 0 .4rem;font-size:1rem;color:var(--ink)">Option 1: Free Cloud PostgreSQL Setup</h3>
      <p class="sm mute">Get a 100% free database from <a href="https://neon.tech" target="_blank" rel="noopener" style="color:var(--or);font-weight:600">Neon.tech</a> or <a href="https://supabase.com" target="_blank" rel="noopener" style="color:var(--or);font-weight:600">Supabase.com</a> (Takes 1 min, no credit card required). Copy the connection link and paste it below:</p>
      <label for="w-dburl">Postgres Connection URL</label>
      <input id="w-dburl" placeholder="postgresql://user:password@ep-cool-db.neon.tech/neondb?sslmode=require" value="${esc(W.cfg.dbUrl||'')}" style="font-family:monospace;font-size:.85rem">
      <div style="margin-top:.7rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <button class="btn ghost sm" data-act="wtestconn" style="flex:0 0 auto">Test Connection</button>

  if(t.status==='Pending')acts+=`<button class="btn" data-act="st" data-id="${id}" data-s="To Be Validated">Submit for validation</button>`}
 if(isVal&&t.status==='To Be Validated')acts+=`<button class="btn" data-act="st" data-id="${id}" data-s="Completed">Approve</button><span class="row" style="flex:0 0 auto"><input id="rh" type="number" min="1" value="2" style="width:70px" aria-label="Extra hours"><button class="btn ghost" data-act="reopen" data-id="${id}">Reopen with extra hours</button></span><button class="btn ghost" data-act="st" data-id="${id}" data-s="Invalid">Mark invalid</button>`;
 const d=$('#dlg');d.innerHTML=`<h2>${esc(t.title)}</h2><p><span class="pill p-${sc(t.status)}">${t.status}</span> ${late(t)?'<span class="pill late">Overdue</span>':''}</p><p>${esc(t.desc)||'<span class="mute">No description.</span>'}</p>
 <p class="sm mute">Doer ${esc(t.doer)} · Validator ${esc(t.validator)}<br>Starts ${fmt(t.start)} · Ends ${fmt(t.end)} · Lead ${hm(t.lead)}</p>
 <div class="row" style="margin:.8rem 0;align-items:center">${acts}</div><h2>Comments</h2>${t.comments.map(c=>`<div class="cm"><b>${esc(c.by)}</b> <span class="mute sm">${fmt(c.t)}</span><br>${esc(c.x)}</div>`).join('')||'<p class="mute sm">No comments yet.</p>'}
 <div class="row" style="margin-top:.6rem"><input id="cm" placeholder="Write a comment" aria-label="Comment"><button class="btn sm" data-act="comment" data-id="${id}" style="flex:0 0 auto">Post</button></div><div style="text-align:right;margin-top:1rem"><button class="btn ghost" data-act="close">Close</button></div>`;d.showModal()}
function calc(){const st=$('#f-start');if(!st)return;if(!st.value){$('#f-end').textContent='Expected end: choose a start time';return}
 const m=(+$('#f-lh').value||0)*60+(+$('#f-lm').value||0);$('#f-end').textContent='Expected end: '+fmt(addWork(new Date(st.value),m,E($('#f-doer').value),$('#f-sat').checked,$('#f-sun').checked))}
function submit(){const title=$('#f-title').value.trim(),st=$('#f-start').value;if(!title||!st){toast('Add a title and a start time.');return}
 const type=$('#f-type').value,doer=$('#f-doer').value,e=E(doer),lead=(+$('#f-lh').value||0)*60+(+$('#f-lm').value||0),sat=$('#f-sat').checked,sun=$('#f-sun').checked,val=$('#f-val').value,base={desc:$('#f-desc').value,type,team:e.team||me.team,doer,validator:val,lead,creator:me.name,comments:[],status:'Scope of Work'};let mid=0,n=0;
 if(type==='Recurring'){mid=S.nextM++;S.masters.push({id:mid,title,type,freq:$('#f-freq').value,doer,validator:val,team:base.team,lead,active:true});
  const first=new Date(st),days=+$('#f-days').value||30,fq=$('#f-freq').value;
  for(let i=0;i<days;i++){const d=new Date(first);d.setDate(first.getDate()+i);const w=d.getDay();
   if(fq==='Weekly'&&w!==first.getDay())continue;if(fq==='Monthly'&&d.getDate()!==first.getDate())continue;
   if((w===0&&!sun)||(w===6&&!sat)||S.holidays.includes(iso(d)))continue;
   S.tasks.push({...base,id:S.nextId++,mid,title,start:d.getTime(),end:addWork(d,lead,e,sat,sun)});n++}}
 else{S.tasks.push({...base,id:S.nextId++,mid,title,start:new Date(st).getTime(),end:addWork(new Date(st),lead,e,sat,sun)});n=1}
 save();toast(n+(n>1?' tasks assigned':' task assigned'));view='mytasks';tab=doer===me.name?'todo':'done';render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT'&&b.type!=='checkbox')return;const a=b.dataset.act,id=+b.dataset.id;
 if(WACT(a,b))return;
 if(a==='login'){me=S.employees.find(e=>e.name===b.dataset.n);try{localStorage.setItem('tms.me',me.name)}catch(e){}view='dashboard';render()}
 else if(a==='logout'){me=null;tok=null;try{localStorage.removeItem('tms.token')}catch(e){}try{localStorage.removeItem('tms.me')}catch(e){}render()}
 else if(a==='nav'){view=b.dataset.v;render();scrollTo(0,0);if(view==='delegate')calc()}
 else if(a==='tab'){tab=b.dataset.t;render()}
 else if(a==='open')openTask(id);else if(a==='close')$('#dlg').close();
 else if(a==='st'){const t=S.tasks.find(x=>x.id===id);t.status=b.dataset.s;if(t.status==='Completed')t.done=Date.now();save();$('#dlg').close();toast('Marked '+t.status);render()}
 else if(a==='reopen'){const t=S.tasks.find(x=>x.id===id),h=+$('#rh').value||1;t.status='Pending';t.lead+=h*60;t.end=addWork(Date.now(),h*60,E(t.doer),false,false);t.comments.push({by:me.name,t:Date.now(),x:'Reopened with '+h+' extra hours.'});save();$('#dlg').close();toast('Task reopened');render()}
 else if(a==='comment'){const x=$('#cm').value.trim();if(!x)return;S.tasks.find(t=>t.id===id).comments.push({by:me.name,t:Date.now(),x});save();openTask(id)}
 else if(a==='submit')submit();
 else if(a==='mlead'){const v=prompt('New lead time in hours:');const h=parseFloat(v);if(!h||h<=0)return;const m=S.masters.find(x=>x.id===id);m.lead=Math.round(h*60);S.tasks.filter(t=>t.mid===id&&t.status==='Scope of Work').forEach(t=>{t.lead=m.lead;t.end=addWork(t.start,m.lead,E(t.doer),false,false)});save();toast('Lead time updated');render()}
 else if(a==='moff'){S.masters.find(x=>x.id===id).active=false;S.tasks=S.tasks.filter(t=>!(t.mid===id&&t.status==='Scope of Work'));save();toast('Recurring task stopped');render()}
 else if(a==='addemp'){const m=readMember(S.employees);if(!m)return;S.employees.push(m);save();toast('Member registered');render()}
 else if(a==='macc'){S.managerAccess=b.checked;save();toast('Saved')}
 else if(a==='addh'){const v=$('#h-new').value;if(v&&!S.holidays.includes(v)){S.holidays.push(v);S.holidays.sort();save();render()}}
 else if(a==='delh'){S.holidays=S.holidays.filter(h=>h!==b.dataset.h);save();render()}
 else if(a==='theme'){const m=b.dataset.m;if(m==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m)}
 else if(a==='reset'){if(STATUS&&!S.demo){toast('To reset a live workspace, clear its storage and redeploy.');return}if(confirm('Erase all data and run setup again?')){S=empty();W={step:1,size:'',be:'',cfg:{},team:[]};mode='login';save();me=null;try{localStorage.removeItem('tms.me')}catch(e){}render()}}});
document.addEventListener('input',ev=>{const a=ev.target.dataset.act;if(a==='fcalc')calc()});
document.addEventListener('change',ev=>{const a=ev.target.dataset.act;if(a==='fcalc')calc();if(a==='ftype')$('#f-rec').hidden=ev.target.value!=='Recurring'});
(async()=>{try{STATUS=await api('GET','/api/status')}catch(e){STATUS=null}
 if(!STATUS){load();if(!S.demo)S=seed();try{me=S.employees.find(e=>e.name===localStorage.getItem('tms.me'))||null}catch(e){}render();return}
 S=empty();S.setup=STATUS.setup?{done:true}:null;
 try{tok=localStorage.getItem('tms.token')}catch(e){}
 if(STATUS.setup&&tok){try{await pull()}catch(e){tok=null}}
 render();
 setInterval(()=>{const t=(document.activeElement||{}).tagName;if(tok&&!S.demo&&!document.hidden&&!$('#dlg').open&&!/INPUT|TEXTAREA|SELECT/.test(t))pull().then(render).catch(()=>{})},30000)})();
</script>
